<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b2118" />
    <title>Suhail: Ages of Arabia</title>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div id="app">
      <main id="stage"></main>
      <header id="topbar">
        <div id="res" aria-live="polite"></div>
        <button type="button" id="btn-menu" class="round small" aria-label="Menu">☰</button>
      </header>
      <button type="button" id="btn-goals" class="goals-pill"></button>
      <div id="warn" hidden></div>
      <aside id="trackers" aria-label="Routes out"></aside>
      <nav id="dock" aria-label="Actions"></nav>
      <button type="button" id="btn-recenter" class="round small" aria-label="Back to town">🎯</button>
      <div id="taskbar" role="status"></div>
      <div id="placebar" hidden></div>
      <div id="notice" role="status" hidden></div>
      <div id="sheet" role="dialog" aria-modal="false" hidden></div>
      <div id="scrim" hidden></div>
      <div id="card" role="dialog" aria-modal="true" hidden></div>
      <div id="rawi" role="dialog" aria-live="polite" hidden></div>
      <div id="tooltip" hidden></div>
      <div id="toast" role="alert" hidden></div>
      <div id="placeholder-notice"></div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
